# Supabase 무료 프로젝트는 1주일 동안 요청이 없으면 잠듭니다 → 매일 한 번 가볍게 읽어서 깨워 둡니다.
# 꺼진 상태로 시작: 저장소 Settings > Secrets and variables > Actions 에
#   Variables: ONMAUM_SUPABASE_ENABLED = true
#   Secrets:   SUPABASE_URL, SUPABASE_ANON_KEY
# 를 넣어야 실제로 실행됩니다.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 21 * * *'   # 매일 06:17 (한국 시간)
  workflow_dispatch:
jobs:
  ping:
    if: ${{ vars.ONMAUM_SUPABASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/hearts?select=no&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
          echo "ok"
